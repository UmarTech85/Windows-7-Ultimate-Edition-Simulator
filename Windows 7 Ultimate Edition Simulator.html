<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Windows 7 Ultimate Simulator</title>
<style>
:root{--glass:rgba(18,42,65,.78);--blue:#0d5b91;--text:#172536}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,sans-serif;color:var(--text);background:#123f6d}
#desktop{position:absolute;inset:0 0 40px;background:linear-gradient(155deg,rgba(9,49,93,.2),transparent 42%),radial-gradient(ellipse at 50% 110%,#d7f1ff 0%,#69b9e7 30%,#126aa9 63%,#063568 100%);overflow:hidden}
#desktop:before{content:"";position:absolute;width:55vw;height:85vh;left:23%;top:3%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.26),rgba(255,255,255,0) 65%);pointer-events:none}
#desktop:after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(0deg,rgba(2,24,48,.5),transparent);pointer-events:none}
.icon-grid{position:absolute;top:12px;left:12px;display:grid;grid-auto-flow:row;grid-template-columns:78px;gap:9px;z-index:1}
.desktop-icon{width:74px;min-height:70px;color:white;text-shadow:0 1px 3px #000;text-align:center;font-size:12px;padding:4px;border:1px solid transparent;border-radius:4px;cursor:default;user-select:none}
.desktop-icon:hover,.desktop-icon:focus{background:rgba(145,207,255,.22);border-color:rgba(255,255,255,.4);outline:none}
.ico{font-size:31px;display:block;filter:drop-shadow(0 2px 2px #123);margin-bottom:3px}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(#5c8eb5aa,#173c60eF 45%,#09223deF);border-top:1px solid #a6d5f5;box-shadow:0 -1px 5px #061b36;display:flex;align-items:center;z-index:10000;padding:0 7px;gap:7px}
#startButton{width:48px;height:39px;margin-top:-2px;border-radius:50%;border:1px solid #a9dfff;background:radial-gradient(circle at 35% 25%,#d8fffe,#45c1f2 35%,#0755a0 68%,#022b61);box-shadow:0 0 7px #6acfff;display:grid;place-items:center;color:white;font-size:23px;text-shadow:0 1px 2px #123;cursor:pointer}
#startButton:hover{filter:brightness(1.2)}#taskApps{display:flex;gap:4px;flex:1;overflow:hidden;height:100%;align-items:center}
.task-app{height:32px;min-width:44px;max-width:180px;padding:0 10px;color:white;border:1px solid #85b7da66;border-radius:4px;background:linear-gradient(#a9d9f055,#1c5b8d99);text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.task-app.active{background:linear-gradient(#d3efff88,#4a94c8aa);border-color:#c3e9ff}
#tray{color:#fff;font-size:12px;text-shadow:0 1px 2px #000;padding:0 9px;text-align:center;min-width:65px;line-height:15px}
.window{position:absolute;left:22%;top:13%;width:min(680px,88vw);height:min(470px,75vh);min-width:280px;min-height:180px;background:#f1f5f8;border:1px solid #6b9bbd;border-radius:7px 7px 3px 3px;box-shadow:0 8px 28px #00172c88;overflow:hidden;display:flex;flex-direction:column}
.window.active{box-shadow:0 9px 32px #00172caa,0 0 0 1px #c3e9ff66}
.titlebar{height:34px;flex-shrink:0;background:linear-gradient(#e5f5ffed,#8cc6e9dd 48%,#d8effbdd);display:flex;align-items:center;padding-left:10px;border-bottom:1px solid #7da9c4;cursor:move;gap:7px;user-select:none}
.title-icon{font-size:17px}.title{font-size:13px;font-weight:600;flex:1;color:#102e48;text-shadow:0 1px #fff}
.win-controls{display:flex;align-self:flex-start;gap:1px;margin-left:auto}.win-controls button{width:31px;height:25px;border:1px solid #8aaec6;border-top:0;background:linear-gradient(#f7fdff,#a6cce3);color:#17344a;font-size:12px;cursor:pointer}.win-controls .close{background:linear-gradient(#ffddd4,#e44d3e);color:#fff;border-color:#b94437;border-radius:0 0 4px 4px}.win-controls button:hover{filter:brightness(1.08)}
.content{flex:1;overflow:auto;background:#fff;position:relative}.toolbar{height:36px;background:linear-gradient(#fff,#e5edf4);border-bottom:1px solid #c3d1dd;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px}.toolbar button,.ui-btn{border:1px solid #9eb5c6;border-radius:3px;background:linear-gradient(#fff,#e5edf4);padding:5px 10px;color:#1a354a;cursor:pointer}.toolbar button:hover,.ui-btn:hover{background:linear-gradient(#fff,#d0e9f8)}
.status{font-size:11px;color:#526b7d;padding:4px 8px;border-top:1px solid #d7e0e8;background:#f4f7fa}
.start-menu{position:absolute;z-index:9999;left:6px;bottom:40px;width:min(420px,96vw);height:440px;max-height:78vh;background:linear-gradient(110deg,#eaf5ff,#fff 60%);border:1px solid #6c9ab9;border-radius:7px 7px 0 0;box-shadow:0 0 20px #001d3b99;display:none;overflow:hidden}
.start-head{height:66px;background:linear-gradient(#5b9bca,#164e83);display:flex;align-items:center;padding:12px;color:white;gap:12px}
.user-avatar{width:43px;height:43px;border:2px solid #d6f2ff;border-radius:6px;background:linear-gradient(135deg,#f8fcff,#7fb8dc);display:grid;place-items:center;font-size:27px}
.start-body{display:flex;height:calc(100% - 66px)}.start-left{width:62%;padding:8px}.start-right{flex:1;background:#dceaf5;border-left:1px solid #c0d3e2;padding:9px 5px}
.start-item{display:flex;align-items:center;gap:10px;padding:7px;border-radius:3px;font-size:13px;cursor:pointer}.start-item:hover{background:#c9e6f8;outline:1px solid #8ac1e3}.start-item span:first-child{font-size:22px;width:28px;text-align:center}.start-right .start-item{font-size:12px;padding:7px 5px}
.searchbox{margin:5px 8px 8px;width:calc(100% - 16px);padding:8px;border:1px solid #aabfce;border-radius:3px}.shutdown{position:absolute;right:10px;bottom:9px;padding:6px 12px;background:linear-gradient(#5b9bca,#164e83);color:#fff;border:1px solid #0c3a65;border-radius:3px;cursor:pointer}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;padding:15px}.app-tile{padding:13px 7px;text-align:center;border:1px solid transparent;border-radius:4px;cursor:pointer}.app-tile:hover{background:#e2f3ff;border-color:#acd7f2}.app-tile span{display:block;font-size:32px;margin-bottom:7px}.app-tile small{display:block;color:#6b7c89;margin-top:4px}
.drive{margin:18px;max-width:420px}.drive-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #d2dde6;border-radius:4px;margin:8px 0;background:#fbfdff}.drive-icon{font-size:38px}.progress{height:14px;background:#e2e7eb;border:1px solid #b9c7d0;border-radius:2px;overflow:hidden}.progress div{height:100%;width:22%;background:linear-gradient(#91d5ff,#1b8ed4)}
textarea.editor{width:100%;height:100%;resize:none;border:0;outline:0;padding:12px;font:14px Consolas,monospace;color:#172536}.paint-area{height:100%;display:flex;flex-direction:column}.paint-tools{padding:8px;display:flex;gap:6px;flex-wrap:wrap;background:#eef4f8;border-bottom:1px solid #ccd9e2}.paint-canvas{background:white;flex:1;touch-action:none;cursor:crosshair}
.calc{padding:14px;max-width:340px;margin:auto}.calc-display{width:100%;font-size:27px;text-align:right;padding:12px;border:1px solid #9caebc;background:#f8fbfd;margin-bottom:8px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.calc-grid button{height:42px;font-size:16px;border:1px solid #a8bac8;background:linear-gradient(#fff,#e3edf5);border-radius:3px}
.settings{padding:20px}.setting-card{display:flex;gap:14px;align-items:center;border-bottom:1px solid #d8e1e8;padding:13px 4px}.setting-card b{display:block}.setting-card p{margin:4px 0;font-size:12px;color:#607486}
.browserbar{display:flex;gap:5px;padding:7px;background:#eaf1f7;border-bottom:1px solid #c6d5e0}.browserbar input{flex:1;min-width:0;border:1px solid #a9bbc8;padding:6px;border-radius:3px}.webhome{padding:26px;text-align:center;background:linear-gradient(#fff,#eef7fd);height:100%}.webhome h1{color:#1769a3;font-weight:400;font-size:28px}.webtiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}.webtiles button{padding:12px;border:1px solid #c4d9e8;background:#fff;border-radius:4px;cursor:pointer}
@media(max-width:600px){.icon-grid{grid-template-columns:70px;gap:4px}.desktop-icon{font-size:11px}.window{left:4%!important;top:6%!important;width:92vw!important;height:78vh!important}.start-menu{width:96vw;height:420px}.start-left{width:59%}.task-app{min-width:35px;padding:0 7px}#tray{min-width:50px;padding:0 3px}}
</style>
</head>
<body>
<div id="desktop">
 <div class="icon-grid">
  <div class="desktop-icon" data-app="computer"><span class="ico">🖥️</span>Computer</div>
  <div class="desktop-icon" data-app="recycle"><span class="ico">🗑️</span>Recycle Bin</div>
  <div class="desktop-icon" data-app="browser"><span class="ico">🌐</span>Internet</div>
  <div class="desktop-icon" data-app="notepad"><span class="ico">📝</span>Notepad</div>
  <div class="desktop-icon" data-app="paint"><span class="ico">🎨</span>Paint</div>
  <div class="desktop-icon" data-app="media"><span class="ico">▶️</span>Media Player</div>
  <div class="desktop-icon" data-app="control"><span class="ico">⚙️</span>Control Panel</div>
</div>
</div>
<div id="taskbar"><button id="startButton" title="Start">⊞</button><div id="taskApps"></div><div id="tray"><span id="clock">12:00 PM</span><br><span>🔊 ▴</span></div></div>
<div id="startMenu" class="start-menu">
 <div class="start-head"><div class="user-avatar">👤</div><div><b>Windows 7 Ultimate</b><div style="font-size:12px;opacity:.85">Welcome</div></div></div>
 <div class="start-body"><div class="start-left">
  <div class="start-item" data-app="browser"><span>🌐</span>Internet</div><div class="start-item" data-app="email"><span>✉️</span>E-mail</div><hr style="border:0;border-top:1px solid #d5e1e9">
  <div class="start-item" data-app="computer"><span>🖥️</span>Computer</div><div class="start-item" data-app="control"><span>⚙️</span>Control Panel</div><div class="start-item" data-app="notepad"><span>📝</span>Notepad</div><div class="start-item" data-app="paint"><span>🎨</span>Paint</div><div class="start-item" data-app="media"><span>▶️</span>Windows Media Player</div><div class="start-item" data-app="calculator"><span>🧮</span>Calculator</div>
  <input id="startSearch" class="searchbox" placeholder="Search programs and files">
 </div><div class="start-right"><div class="start-item" data-app="personalize">🎨 Personalization</div><div class="start-item" data-app="games">🎮 Games</div><div class="start-item" data-app="help">❔ Help and Support</div><div class="start-item" data-app="run">⌨️ Run…</div></div></div>
 <button class="shutdown" id="shutdown">Shut down ▾</button>
</div>
<script>
const desktop=document.getElementById('desktop'), taskApps=document.getElementById('taskApps'), startMenu=document.getElementById('startMenu');
let z=20, winCount=0, notesSaved='';
const apps={
 computer:{title:'Computer',icon:'🖥️',width:650,height:430,body:()=>`<div class="toolbar"><button>Organize ▾</button><button>System properties</button><button>Uninstall or change a program</button></div><div class="app-grid"><div class="app-tile"><span>💽</span>Local Disk (C:)<small>Available: 78.4 GB of 100 GB</small></div><div class="app-tile"><span>💿</span>DVD RW Drive (D:)</div><div class="app-tile"><span>📁</span>Documents</div><div class="app-tile"><span>🎵</span>Music</div><div class="app-tile"><span>🖼️</span>Pictures</div><div class="app-tile"><span>⬇️</span>Downloads</div></div><div class="status">6 items · This is a simulated computer, not real disk storage.</div>`},
 recycle:{title:'Recycle Bin',icon:'🗑️',body:()=>`<div class="toolbar"><button>Organize</button><button>Empty the Recycle Bin</button></div><div style="padding:30px;text-align:center;color:#617587"><div style="font-size:60px">🗑️</div><p>The Recycle Bin is empty.</p><small>Files deleted inside this simulator are not real system files.</small></div>`},
 notepad:{title:'Untitled - Notepad',icon:'📝',width:600,height:400,body:()=>`<div class="toolbar"><button onclick="document.execCommand('selectAll')">Edit</button><button onclick="saveNote()">Save (simulated)</button><button onclick="document.querySelector('.editor').value=''">New</button></div><textarea class="editor" spellcheck="false" placeholder="Type your text here..."></textarea><div class="status">Ready</div>`},
 paint:{title:'Paint',icon:'🎨',width:680,height:480,body:()=>`<div class="paint-area"><div class="paint-tools"><button class="ui-btn" onclick="clearPaint()">New</button><label class="ui-btn">Color <input id="paintColor" type="color" value="#1769aa" style="vertical-align:middle"></label><label class="ui-btn">Brush <input id="brushSize" type="range" min="1" max="24" value="4"></label><button class="ui-btn" onclick="clearPaint()">Clear</button></div><canvas class="paint-canvas"></canvas></div>`},
 browser:{title:'Internet Explorer',icon:'🌐',width:760,height:500,body:()=>`<div class="browserbar"><button onclick="history.back()">◀</button><button onclick="history.forward()">▶</button><button onclick="browserHome()">⌂</button><input id="address" value="https://www.bing.com" aria-label="Address bar"><button onclick="goWeb()">Go</button></div><div class="content" style="overflow:auto"><div class="webhome"><div style="font-size:46px">🌐</div><h1>Internet Explorer</h1><p>Welcome to the Windows 7 Ultimate Simulator</p><p>External sites may not load inside this window due to browser security restrictions.</p><div class="webtiles"><button onclick="openSite('https://www.bing.com')">Bing Search</button><button onclick="openSite('https://www.google.com')">Google</button><button onclick="openSite('https://www.wikipedia.org')">Wikipedia</button><button onclick="openSite('https://www.youtube.com')">YouTube</button></div><p id="browserMessage" style="font-size:12px;color:#657d8e;margin-top:25px">Enter a website address above, or choose a shortcut.</p></div></div>`},
 media:{title:'Windows Media Player',icon:'▶️',width:600,height:410,body:()=>`<div style="height:100%;background:linear-gradient(135deg,#eaf5fb,#c7e1f2);display:flex;flex-direction:column"><div class="toolbar"><button>Organize</button><button>Stream</button><button>Play</button></div><div style="flex:1;display:grid;place-items:center;text-align:center"><div><div style="font-size:70px">▶️</div><h3>Windows Media Player</h3><p>Play music and video files from your device</p><label class="ui-btn">Open media file<input type="file" accept="audio/*,video/*" multiple hidden onchange="playMedia(this)"></label><div id="mediaOutput" style="margin-top:12px"></div></div></div></div>`},
 control:{title:'Control Panel',icon:'⚙️',width:650,height:440,body:()=>`<div class="toolbar"><button>Control Panel Home</button><span>Adjust your computer's settings</span></div><div class="app-grid"><div class="app-tile" onclick="openApp('personalize')"><span>🎨</span>Appearance and Personalization</div><div class="app-tile" onclick="openApp('system')"><span>💻</span>System and Security</div><div class="app-tile" onclick="openApp('network')"><span>🌐</span>Network and Internet</div><div class="app-tile" onclick="openApp('programs')"><span>📦</span>Programs</div><div class="app-tile" onclick="openApp('sound')"><span>🔊</span>Hardware and Sound</div><div class="app-tile" onclick="openApp('accounts')"><span>👥</span>User Accounts</div></div>`},
 personalize:{title:'Personalization',icon:'🎨',body:()=>`<div class="settings"><h2>Change the visuals and sounds on your computer</h2><div class="setting-card"><span style="font-size:32px">🖼️</span><div><b>Desktop Background</b><p>Windows 7-inspired blue desktop wallpaper is active.</p><button class="ui-btn" onclick="changeWallpaper()">Change wallpaper</button></div></div><div class="setting-card"><span style="font-size:32px">🪟</span><div><b>Window Color</b><p>Aero-style glass windows and taskbar.</p><button class="ui-btn" onclick="toggleTheme()">Toggle light / dark windows</button></div></div><div class="setting-card"><span style="font-size:32px">🔊</span><div><b>Sounds</b><p>System sounds are represented by interface controls.</p></div></div></div>`},
 calculator:{title:'Calculator',icon:'🧮',width:310,height:390,body:()=>`<div class="calc"><input class="calc-display" id="calcDisplay" value="0" readonly><div class="calc-grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','C','+','=','%','⌫'].map(k=>`<button onclick="calcKey('${k}')">${k}</button>`).join('')}</div></div>`},
 system:{title:'System and Security',icon:'💻',body:()=>`<div class="settings"><h2>System</h2><div class="setting-card"><span>🛡️</span><div><b>Windows 7 Ultimate Simulator</b><p>Browser-based desktop experience · Build 7601-style UI</p></div></div><div class="setting-card"><span>🔄</span><div><b>Windows Update</b><p>This simulator cannot install real Windows updates.</p><button class="ui-btn" onclick="alert('Your simulator UI is up to date. This is not a real Windows Update service.')">Check for updates</button></div></div></div>`},
 network:{title:'Network and Internet',icon:'🌐',body:()=>`<div class="settings"><h2>Network and Internet</h2><div class="setting-card"><span>📶</span><div><b>Network status</b><p>Internet access depends on your actual browser and connection.</p><button class="ui-btn" onclick="openApp('browser')">Open Internet Explorer</button></div></div></div>`},
 programs:{title:'Programs and Features',icon:'📦',body:()=>`<div class="settings"><h2>Programs and Features</h2><p>Installed simulator apps</p><ul><li>Internet Explorer (simulated)</li><li>Notepad</li><li>Paint</li><li>Windows Media Player</li><li>Calculator</li></ul></div>`},
 sound:{title:'Sound',icon:'🔊',body:()=>`<div class="settings"><h2>Sound</h2><p>Sound settings are limited by your browser and device.</p><label>Volume <input type="range" min="0" max="100" value="70"></label></div>`},
 accounts:{title:'User Accounts',icon:'👥',body:()=>`<div class="settings"><h2>User Accounts</h2><div class="setting-card"><span>👤</span><div><b>Simulator User</b><p>Local demo account. No real Windows account is created.</p></div></div></div>`},
 games:{title:'Games',icon:'🎮',body:()=>`<div class="app-grid"><div class="app-tile" onclick="alert('Minesweeper is not included in this build.')"><span>💣</span>Minesweeper</div><div class="app-tile" onclick="alert('Solitaire is not included in this build.')"><span>🃏</span>Solitaire</div><div class="app-tile"><span>♟️</span>Chess (placeholder)</div></div>`},
 help:{title:'Help and Support',icon:'❔',body:()=>`<div class="settings"><h2>Windows 7 Ultimate Simulator Help</h2><p>Double-click desktop icons to launch apps. Drag a title bar to move a window. Use the title-bar buttons to minimize, maximize, or close it.</p><p>This is a web-based simulation, not a full Windows operating system.</p></div>`},
 run:{title:'Run',icon:'⌨️',width:380,height:190,body:()=>`<div class="settings"><p>Type the name of a simulator app:</p><input id="runInput" style="width:100%;padding:8px;border:1px solid #9fb5c5" placeholder="notepad, paint, calculator..."><p><button class="ui-btn" onclick="runCommand()">OK</button> <button class="ui-btn" onclick="closeWindow(this)">Cancel</button></p></div>`},
 email:{title:'E-mail',icon:'✉️',body:()=>`<div class="settings"><h2>E-mail</h2><p>No mail account is configured in this simulator.</p><button class="ui-btn" onclick="openSite('https://mail.google.com')">Open Gmail in browser</button></div>`}
};
function openApp(name){startMenu.style.display='none';let spec=apps[name];if(!spec)return;let id='w'+(++winCount);let win=document.createElement('div');win.className='window active';win.id=id;win.dataset.app=name;win.style.zIndex=++z;if(spec.width)win.style.width=`min(${spec.width}px,92vw)`;if(spec.height)win.style.height=`min(${spec.height}px,84vh)`;win.style.left=(Math.max(3,12+(winCount%5)*5))+'%';win.style.top=(Math.max(4,7+(winCount%4)*4))+'%';win.innerHTML=`<div class="titlebar"><span class="title-icon">${spec.icon}</span><span class="title">${spec.title}</span><div class="win-controls"><button title="Minimize" data-action="min">—</button><button title="Maximize" data-action="max">□</button><button title="Close" class="close" data-action="close">×</button></div></div><div class="content">${spec.body()}</div>`;desktop.appendChild(win);let task=document.createElement('button');task.className='task-app active';task.dataset.win=id;task.textContent=spec.icon+' '+spec.title;taskApps.appendChild(task);task.onclick=()=>{if(win.style.display==='none'){win.style.display='flex';win.style.zIndex=++z;task.classList.add('active')}else if(win.classList.contains('active')){win.style.display='none';task.classList.remove('active')}else{activate(win)}};win.addEventListener('pointerdown',()=>activate(win));win.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=b.dataset.action;if(a==='close'){win.remove();task.remove()}if(a==='min'){win.style.display='none';task.classList.remove('active')}if(a==='max'){if(win.dataset.max==='1'){win.style.left=win.dataset.oldLeft;win.style.top=win.dataset.oldTop;win.style.width=win.dataset.oldWidth;win.style.height=win.dataset.oldHeight;win.dataset.max='0'}else{win.dataset.oldLeft=win.style.left;win.dataset.oldTop=win.style.top;win.dataset.oldWidth=win.style.width;win.dataset.oldHeight=win.style.height;win.style.left='0';win.style.top='0';win.style.width='100%';win.style.height='100%';win.dataset.max='1'}win.style.zIndex=++z}});makeDraggable(win);task.classList.add('active');if(name==='paint')setupPaint(win);if(name==='browser')setupBrowser(win);if(name==='calculator'){}return win}
function activate(win){document.querySelectorAll('.window').forEach(w=>w.classList.remove('active'));document.querySelectorAll('.task-app').forEach(t=>t.classList.remove('active'));win.classList.add('active');win.style.zIndex=++z;let t=document.querySelector(`[data-win="${win.id}"]`);if(t)t.classList.add('active')}
function makeDraggable(win){let bar=win.querySelector('.titlebar'),sx,sy,sl,st,drag=false;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||win.dataset.max==='1')return;drag=true;sx=e.clientX;sy=e.clientY;sl=win.offsetLeft;st=win.offsetTop;bar.setPointerCapture(e.pointerId);activate(win)});bar.addEventListener('pointermove',e=>{if(!drag)return;win.style.left=Math.max(-win.offsetWidth+80,Math.min(innerWidth-80,sl+e.clientX-sx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-70,st+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>drag=false);bar.addEventListener('pointercancel',()=>drag=false)}
document.querySelectorAll('[data-app]').forEach(el=>el.addEventListener('dblclick',()=>openApp(el.dataset.app)));document.querySelectorAll('.start-item').forEach(el=>el.addEventListener('click',()=>openApp(el.dataset.app)));
document.getElementById('startButton').onclick=()=>startMenu.style.display=startMenu.style.display==='block'?'none':'block';document.addEventListener('pointerdown',e=>{if(!e.target.closest('#startMenu')&&!e.target.closest('#startButton'))startMenu.style.display='none'});
document.getElementById('shutdown').onclick=()=>{if(confirm('Shut down the Windows 7 simulator?')){document.querySelectorAll('.window').forEach(w=>w.remove());taskApps.innerHTML='';startMenu.style.display='none';alert('Simulator shut down. Reload the page to start again.')}};
document.getElementById('startSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();let found=Object.keys(apps).find(k=>k.includes(q)||apps[k].title.toLowerCase().includes(q));if(found)openApp(found);else alert('No matching simulator app found.')}})
function changeWallpaper(){let d=document.getElementById('desktop');d.style.background=d.dataset.alt==='1'?'linear-gradient(155deg,rgba(9,49,93,.2),transparent 42%),radial-gradient(ellipse at 50% 110%,#d7f1ff 0%,#69b9e7 30%,#126aa9 63%,#063568 100%)':'linear-gradient(135deg,#173f76,#74b8de 45%,#e1f5ff)';d.dataset.alt=d.dataset.alt==='1'?'0':'1'}
function toggleTheme(){document.querySelectorAll('.window .content').forEach(c=>{c.style.background=c.style.background==='rgb(34, 45, 57)'?'':'#222d39';c.style.color=c.style.color==='white'?'':'white'})}
function setupPaint(win){let c=win.querySelector('canvas'),ctx=c.getContext('2d'),drawing=false;function resize(){let r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineJoin='round'}setTimeout(resize,30);c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);let r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)});c.addEventListener('pointermove',e=>{if(!drawing)return;let r=c.getBoundingClientRect();ctx.strokeStyle=win.querySelector('#paintColor').value;ctx.lineWidth=win.querySelector('#brushSize').value;ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()});c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false);win._clear=()=>{ctx.clearRect(0,0,c.width,c.height)}}
function clearPaint(){let w=document.querySelector('.window.active');if(w&&w._clear)w._clear()}
function setupBrowser(win){let input=win.querySelector('#address');input.addEventListener('keydown',e=>{if(e.key==='Enter')goWebFrom(win)});win.querySelectorAll('.webtiles button').forEach(b=>b.onclick=()=>openSite(b.dataset.url||({'Bing Search':'https://www.bing.com','Google':'https://www.google.com','Wikipedia':'https://www.wikipedia.org','YouTube':'https://www.youtube.com'}[b.textContent])));win._browserGo=()=>goWebFrom(win)}
function goWebFrom(win){let input=win.querySelector('#address'),q=input.value.trim();if(!q)return;let url=/^https?:\/\//i.test(q)?q:(q.includes('.')&&!q.includes(' ')?'https://'+q:'https://www.google.com/search?q='+encodeURIComponent(q));window.open(url,'_blank','noopener');win.querySelector('#browserMessage').textContent='Opened in a new browser tab: '+url}
function goWeb(){let w=document.querySelector('.window.active');if(w&&w._browserGo)w._browserGo()}function browserHome(){let w=document.querySelector('.window.active');if(w){w.querySelector('#address').value='https://www.bing.com';w.querySelector('#browserMessage').textContent='Home page selected.'}}
function openSite(url){window.open(url,'_blank','noopener')}
function saveNote(){let w=document.querySelector('.window.active');if(w){notesSaved=w.querySelector('textarea').value;alert('Text saved for this page session. Use copy/paste or your browser to save it permanently.')}} 
function playMedia(input){let files=[...input.files];let out=input.closest('.content').querySelector('#mediaOutput');out.innerHTML='';files.forEach(f=>{let u=URL.createObjectURL(f),el=document.createElement(f.type.startsWith('video/')?'video':'audio');el.src=u;el.controls=true;el.style.maxWidth='90%';el.style.maxHeight='180px';el.style.display='block';el.style.margin='8px auto';out.appendChild(el)})}
function calcKey(k){let d=document.getElementById('calcDisplay');if(!d)return;if(k==='C'){d.value='0';return}if(k==='⌫'){d.value=d.value.slice(0,-1)||'0';return}if(k==='='){try{let exp=d.value.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/(). ]+$/.test(exp))throw 0;d.value=String(Function('"use strict";return ('+exp+')')())}catch{d.value='Error'}return}d.value=d.value==='0'?k:d.value+k}
function runCommand(){let el=document.getElementById('runInput');if(!el)return;let q=el.value.toLowerCase().trim();let k=Object.keys(apps).find(k=>k===q||apps[k].title.toLowerCase()===q);if(k)openApp(k);else alert('Unknown command. Try notepad, paint, browser, computer, calculator or control.')}
function closeWindow(btn){let w=btn.closest('.window');if(w){let t=document.querySelector(`[data-win="${w.id}"]`);if(t)t.remove();w.remove()}}
function updateClock(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}updateClock();setInterval(updateClock,15000);
</script>
</body></html>
