let exFiles;try{const stored=JSON.parse(localStorage.getItem(EX_KEY));exFiles=Array.isArray(stored)?stored:structuredClone(defaultFiles)}catch(e){exFiles=JSON.parse(JSON.stringify(defaultFiles))}

function exItem(id){return exFiles.find(f=>f.id===id)}

function exExists(parent,name,except){return exFiles.some(f=>f.parent===parent&&f.id!==except&&f.name.toLowerCase()===name.toLowerCase())}
function exName(parent,initial,except){let name=prompt('Enter a name:',initial);if(name===null)return null;name=name.trim();if(!name||/[\\/:*?"<>|]/.test(name)){alert('Enter a name without \\ / : * ? " < > or |.');return null}if(exExists(parent,name,except)){alert('An item with that name already exists in this location.');return null}return name}

function setupExplorer(win,location){win._ex={location,history:[location],index:0,selected:null,query:'',view:'tiles',editing:null};exRender(win)}

 let content=s.editing&&exItem(s.editing)?`<div class="ex-editor"><b>Editing ${exEscape(exItem(s.editing).name)}</b><textarea aria-label="File contents">${exEscape(exItem(s.editing).content||'')}</textarea><div class="ex-actions"><button data-ex="save" class="ui-btn">Save</button><button data-ex="cancel-edit" class="ui-btn">Close editor</button></div><span class="ex-note">Text is saved in this browser, not on your device's file system.</span></div>`:`<h3 class="ex-heading">${exEscape(loc==='root'?'Computer':loc==='trash'?'Recycle Bin':current.name)}</h3>${loc==='d'?'<p class="ex-note">This simulated drive has no disc inserted.</p>':''}<div class="ex-items ${s.view==='details'?'details':''}">${items.map(f=>`<button class="ex-item ${s.selected===f.id?'selected':''}" data-item="${exEscape(f.id)}" aria-label="${exEscape(f.name)}" aria-pressed="${s.selected===f.id}"><span class="ex-icon" aria-hidden="true">${icon(f)}</span><span class="ex-name">${exEscape(f.name)}<small>${f.type==='drive'?'78.4 GB free of 100 GB (simulated)':f.type==='dvd'?'No disc':loc==='trash'?'Originally: '+exEscape(exPath(f.originalParent)):f.type==='text'?'Text document':'Folder'}</small></span></button>`).join('')}</div>${!items.length?`<div class="ex-empty">${s.query?'No items match your search.':loc==='trash'?'The Recycle Bin is empty.':'This folder is empty.'}</div>`:''}`;
 win.querySelector('.content').innerHTML=`<div class="explorer"><div class="ex-nav"><button data-ex="back" title="Back" aria-label="Back" ${s.index===0?'disabled':''}>◀</button><button data-ex="forward" title="Forward" aria-label="Forward" ${s.index>=s.history.length-1?'disabled':''}>▶</button><button data-ex="up" title="Up" aria-label="Up" ${loc==='root'||loc==='trash'?'disabled':''}>↑</button><input class="ex-address" aria-label="Address" value="${exEscape(exPath(loc))}" title="Enter a Computer path"><button data-ex="go">Go</button><input class="ex-search" aria-label="Search current folder" placeholder="Search" value="${exEscape(s.query)}"></div><div class="ex-toolbar"><button data-ex="system">System properties</button><button data-ex="programs">Uninstall or change a program</button>${loc==='trash'?`<button data-ex="restore" ${!selected?'disabled':''}>Restore</button><button data-ex="permanent" ${!selected?'disabled':''}>Delete permanently</button><button data-ex="empty" ${!items.length?'disabled':''}>Empty Recycle Bin</button>`:`<button data-ex="new-folder" ${!writable?'disabled':''}>New folder</button><button data-ex="new-text" ${!writable?'disabled':''}>New text file</button><button data-ex="open" ${!selected?'disabled':''}>Open</button><button data-ex="rename" ${!selected||selected.fixed?'disabled':''}>Rename</button><button data-ex="delete" ${!selected||selected.fixed?'disabled':''}>Delete</button><button data-ex="copy" ${!selected||selected.fixed?'disabled':''}>Copy</button><button data-ex="cut" ${!selected||selected.fixed?'disabled':''}>Cut</button><button data-ex="paste" ${!writable||!exClipboard?'disabled':''}>Paste</button><button data-ex="properties" ${!selected?'disabled':''}>Properties</button>`}<select aria-label="Change view" data-ex-view><option value="tiles" ${s.view==='tiles'?'selected':''}>Tiles</option><option value="details" ${s.view==='details'?'selected':''}>Details</option></select></div><div class="ex-body"><nav class="ex-sidebar" aria-label="Navigation"><b>Favorites</b>${sidebar.map(([id,ic,label])=>`<button data-location="${id}" class="${loc===id?'current':''}">${ic} ${label}</button>`).join('')}</nav><main class="ex-main">${content}</main></div><div class="ex-status">${items.length} ${items.length===1?'item':'items'}${s.selected?' · 1 selected':''} · Simulated storage${exStorageAvailable?' (saved in this browser)':' (session only: browser storage unavailable)'}</div></div>`;
 let root=win.querySelector('.explorer');root.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>exGo(win,b.dataset.location));root.querySelectorAll('[data-item]').forEach(b=>{b.onclick=()=>{s.selected=b.dataset.item;root.querySelectorAll('[data-item]').forEach(item=>{let selected=item===b;item.classList.toggle('selected',selected);item.setAttribute('aria-pressed',String(selected))});let f=exItem(s.selected);root.querySelectorAll('[data-ex]').forEach(button=>{let a=button.dataset.ex;if(['open','properties','restore','permanent'].includes(a))button.disabled=!f;if(['rename','delete','copy','cut'].includes(a))button.disabled=!f||f.fixed});root.querySelector('.ex-status').textContent=items.length+' '+(items.length===1?'item':'items')+' · 1 selected · Simulated storage'+(exStorageAvailable?' (saved in this browser)':' (session only: browser storage unavailable)')};b.ondblclick=()=>exOpen(win,b.dataset.item);b.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();exOpen(win,b.dataset.item)}}});
 root.querySelector('[data-ex-view]').onchange=e=>{s.view=e.target.value;exRender(win)};
 let search=root.querySelector('.ex-search');search.oninput=()=>{let pos=search.selectionStart;s.query=search.value;s.selected=null;exRender(win);let next=win.querySelector('.ex-search');next.focus();next.setSelectionRange(pos,pos)};

function exAddress(win,value){let path=value.trim().replace(/\\/g,' > ').split(/\s*>\s*/).filter(Boolean);if(!path.length)return;if(path[0].toLowerCase()==='recycle bin'){exGo(win,'trash');return}if(path[0].toLowerCase()==='computer'||path[0].toLowerCase()==='this pc')path.shift();let id='root';for(let part of path){let f=exFiles.find(x=>x.parent===id&&(x.name.toLowerCase()===part.toLowerCase()||(id==='root'&&part.toLowerCase()==='c:'&&x.id==='c')||(id==='root'&&part.toLowerCase()==='d:'&&x.id==='d')));if(!f||f.type==='text'){alert('Location not found.');return}id=f.id}exGo(win,id)}
function exOpen(win,id){let f=exItem(id);if(!f)return;if(win._ex.location==='trash'){alert('Restore this item before opening it.');return}if(f.type==='text'){win._ex.editing=id;exRender(win)}else exGo(win,id)}
function exAction(win,action){let s=win._ex,loc=s.location,f=exItem(s.selected),current=exItem(loc);

 if(action==='save'){let file=exItem(s.editing);if(file){file.content=win.querySelector('.ex-editor textarea').value;exSave();alert('Saved in the simulated computer.')}exRefresh();return}if(action==='cancel-edit'){s.editing=null;exRender(win);return}
 if(action==='new-folder'||action==='new-text'){let name=exName(loc,action==='new-folder'?'New folder':'New Text Document.txt');if(!name)return;let item={id:exId(),parent:loc,name,type:action==='new-folder'?'folder':'text'};if(item.type==='text')item.content='';exFiles.push(item);s.selected=item.id;exSave();exRefresh();return}
 if(action==='rename'&&f&&!f.fixed){let name=exName(f.parent,f.name,f.id);if(name){f.name=name;exSave();exRefresh()}return}

 if(action==='paste'&&exClipboard){let source=exItem(exClipboard.id);if(!source||source.parent==='trash'){exClipboard=null;alert('The copied item is no longer available.');exRefresh();return}if(exInside(loc,source.id)){alert('Cannot paste a folder into itself.');return}let name=source.name;if(exExists(loc,name)){name=exName(loc,name+' - Copy');if(!name)return}if(exClipboard.cut){source.parent=loc;source.name=name;exClipboard=null}else{function clone(node,parent,newName){let copy={...node,id:exId(),parent,name:newName||node.name};delete copy.originalParent;exFiles.push(copy);exFiles.filter(x=>x.parent===node.id).slice().forEach(child=>clone(child,copy.id));return copy}s.selected=clone(source,loc,name).id}exSave();exRefresh();return}

function saveNote(){let w=document.querySelector('.window.active');if(w){notesSaved=w.querySelector('textarea').value;alert('Text saved for this page session. Use copy/paste or your browser to save it permanently.')}} 
function playMedia(input){let files=[...input.files];let out=input.closest('.content').querySelector('#mediaOutput');out.innerHTML='';files.forEach(f=>{let u=URL.createObjectURL(f),el=document.createElement(f.type.startsWith('video/')?'video':'audio');el.src=u;el.controls=true;el.style.maxWidth='90%';el.style.maxHeight='180px';el.style.display='block';el.style.margin='8px auto';out.appendChild(el)})}
function calcKey(k){let d=document.getElementById('calcDisplay');if(!d)return;if(k==='C'){d.value='0';return}if(k==='⌫'){d.value=d.value.slice(0,-1)||'0';return}if(k==='='){try{let exp=d.value.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');if(!/^[0-9+\-*/(). ]+$/.test(exp))throw 0;d.value=String(Function('"use strict";return ('+exp+')')())}catch{d.value='Error'}return}d.value=d.value==='0'?k:d.value+k}
function runCommand(){let el=document.getElementById('runInput');if(!el)return;let q=el.value.toLowerCase().trim();let k=Object.keys(apps).find(k=>k===q||apps[k].title.toLowerCase()===q);if(k)openApp(k);else alert('Unknown command. Try notepad, paint, browser, computer, calculator or control.')}
function closeWindow(btn){let w=btn.closest('.window');if(w){let t=document.querySelector(`[data-win="${w.id}"]`);if(t)t.remove();w.remove()}}
function updateClock(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'})}updateClock();setInterval(updateClock,15000);
</script>
</body></html>
